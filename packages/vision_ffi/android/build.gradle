group = "app.shootingcompanion.vision_ffi"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:9.0.1")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

def isReleaseInvocation = gradle.startParameter.taskNames.any {
    it.toLowerCase(Locale.ROOT).contains("release")
}

android {
    namespace = "app.shootingcompanion.vision_ffi"
    compileSdk = 36

    defaultConfig {
        minSdk = 33
        ndk {
            // Physical releases are Android-first and arm64-only. Keep x86_64
            // available for local emulator/debug builds without packaging it
            // into the production APK.
            if (isReleaseInvocation) {
                abiFilters "arm64-v8a"
            } else {
                abiFilters "arm64-v8a", "x86_64"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path = "../src/CMakeLists.txt"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}
