name: shooting_companion_vision_ffi
description: Offline FFI adapter for the experimental Shooting Companion vision core.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2

dependencies:
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  shooting_companion_vision_api:
    path: ../vision_api

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
