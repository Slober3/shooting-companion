name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Release contract and privacy unit tests
        run: python -m unittest discover -s tools/tests -p "test_*.py"
      - name: Verify release contract against source
        run: python tools/verify_release_contract.py
      - name: Reject private validation data and release artifacts
        run: python tools/check_privacy_leaks.py
      - name: Verify first-party documentation
        run: python tools/verify_docs.py
      - name: Reject whitespace errors outside verbatim third-party licenses
        run: >-
          git diff-tree --check --no-commit-id -r HEAD --
          . ':(exclude)third_party/licenses/**'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Resolve app
        working-directory: apps/mobile
        run: flutter pub get
      - name: Verify generated database
        working-directory: apps/mobile
        run: dart run build_runner build
      - name: Reject stale generated database code
        run: git diff --exit-code
      - name: Format
        run: dart format --output=none --set-exit-if-changed apps/mobile/lib apps/mobile/test packages
      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze
      - name: Flutter tests
        working-directory: apps/mobile
        run: flutter test
      - name: Verify Unicode PDF rendering
        working-directory: apps/mobile
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          PDF="build/test-output/unicode-report.pdf"
          test -s "$PDF"
          pdftotext "$PDF" build/test-output/unicode-report.txt
          grep -F "Offline trainingsrapport • gegenereerd" build/test-output/unicode-report.txt
          grep -F "é ë ï ’ – —" build/test-output/unicode-report.txt
          grep -F "Opstelling é – onderschrift bij de foto" build/test-output/unicode-report.txt
          if grep -F $'\uFFFD' build/test-output/unicode-report.txt; then
            echo "Unicode replacement glyph found in PDF" >&2
            exit 1
          fi
          pdftoppm -png -r 120 "$PDF" build/test-output/unicode-report-page
          test -s build/test-output/unicode-report-page-1.png
          test -s build/test-output/unicode-report-page-2.png
      - name: Upload rendered PDF fixture
        uses: actions/upload-artifact@v7
        with:
          name: unicode-pdf-render
          path: apps/mobile/build/test-output/unicode-report-page-*.png
      - name: Dart package tests
        shell: bash
        run: |
          packages=(
            packages/domain
            packages/target_profiles
            packages/scoring
            packages/photo_geometry
            packages/analysis
            packages/coaching
            packages/training
            packages/vision_api
            packages/vision_research
          )
          for package in "${packages[@]}"; do
            echo "::group::$package"
            (cd "$package" && dart pub get && dart analyze && dart test)
            echo "::endgroup::"
          done
      - name: Shot timer Flutter package
        working-directory: packages/shot_timer
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Vision FFI Flutter package
        working-directory: packages/vision_ffi
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Shot timer Android unit tests
        working-directory: apps/mobile/android
        run: ./gradlew :shooting_companion_shot_timer:testDebugUnitTest
      - name: Install pinned OpenCV Android SDK
        shell: bash
        run: |
          mkdir -p .tooling/opencv-4.13.0
          curl --fail --location --retry 3 \
            --output .tooling/opencv-4.13.0/opencv-4.13.0-android-sdk.zip \
            https://github.com/opencv/opencv/releases/download/4.13.0/opencv-4.13.0-android-sdk.zip
          echo "edfda20fdf65d0bd45391d168ec5261dd30b600b00279c4d910d7f1c3e020f0f  .tooling/opencv-4.13.0/opencv-4.13.0-android-sdk.zip" \
            | sha256sum --check
          unzip -q .tooling/opencv-4.13.0/opencv-4.13.0-android-sdk.zip \
            -d .tooling/opencv-4.13.0
          test -f .tooling/opencv-4.13.0/OpenCV-android-sdk/sdk/native/jni/OpenCVConfig.cmake
      - name: Build arm64 release APK with OpenCV
        working-directory: apps/mobile
        env:
          OPENCV_ANDROID_SDK: ${{ github.workspace }}/.tooling/opencv-4.13.0/OpenCV-android-sdk
        run: >-
          flutter build apk --release --target-platform android-arm64
          --dart-define=GIT_COMMIT=${{ github.sha }}
      - name: Verify release contract against built APK
        run: >-
          python tools/verify_release_contract.py --apk
          apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          --apkanalyzer
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
      - name: Install pinned Syft
        shell: bash
        run: |
          mkdir -p .tooling/syft-1.50.0
          curl --fail --location --silent --show-error \
            https://github.com/anchore/syft/releases/download/v1.50.0/syft_1.50.0_linux_amd64.tar.gz \
            --output .tooling/syft-1.50.0/syft_1.50.0_linux_amd64.tar.gz
          echo "bf7b29ff57f06da30918266a0e1c2885a8f99784798d1bdb1628886aa015d788  .tooling/syft-1.50.0/syft_1.50.0_linux_amd64.tar.gz" \
            | sha256sum --check
          tar -xzf .tooling/syft-1.50.0/syft_1.50.0_linux_amd64.tar.gz \
            -C .tooling/syft-1.50.0 syft
          .tooling/syft-1.50.0/syft version
      - name: Generate CycloneDX SBOM for release sources
        shell: bash
        env:
          SYFT_CHECK_FOR_APP_UPDATE: "false"
        run: |
          mkdir -p release-artifacts
          short_sha="${GITHUB_SHA:0:7}"
          .tooling/syft-1.50.0/syft scan dir:. \
            --source-name shooting-companion \
            --source-version "0.8.0+1-${short_sha}" \
            --exclude './.git/**' \
            --exclude './.dart_tool/**' \
            --exclude '**/.dart_tool/**' \
            --exclude '**/build/**' \
            --exclude './.tooling/**' \
            --exclude './.local/**' \
            --exclude './graphify-out/**' \
            --exclude './release-artifacts/**' \
            --output cyclonedx-json=release-artifacts/app-release.sbom.cdx.json
          python -c "import json; data=json.load(open('release-artifacts/app-release.sbom.cdx.json', encoding='utf-8')); assert len(data.get('components', [])) >= 100"
      - name: Name release artifact and generate SHA-256
        shell: bash
        run: |
          short_sha="${GITHUB_SHA:0:7}"
          artifact="shooting-companion-0.8.0+1-${short_sha}-arm64-release.apk"
          mkdir -p release-artifacts
          cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk \
            "release-artifacts/${artifact}"
          mv release-artifacts/app-release.sbom.cdx.json \
            "release-artifacts/${artifact%.apk}.sbom.cdx.json"
          (cd release-artifacts && sha256sum "${artifact}" > "${artifact}.sha256")
      - name: Upload validated release artifact
        uses: actions/upload-artifact@v7
        with:
          name: shooting-companion-arm64-release
          path: release-artifacts/

  graphify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pinned Graphify
        run: python -m pip install --disable-pip-version-check graphifyy==0.9.40
      - name: Update and normalize AST-only graph
        run: |
          graphify update .
          python tools/normalize_graphify_output.py
      - name: Verify graph scope and required 0.8 symbols
        run: python tools/verify_graphify.py
      - name: Verify graph queries and relationships
        run: |
          graphify query "guided drill confirmed series" --budget 800
          graphify explain "GuidedDrillRunnerScreen"
          graphify path "TrainingToolsScreen" "ShootingRepository" --undirected
          graphify diagnose multigraph --json > "$RUNNER_TEMP/graphify-multigraph.json"
      - name: Reject stale durable graph output
        run: >-
          git diff --exit-code --
          graphify-out/graph.json
          graphify-out/manifest.json
          graphify-out/.graphify_root
          graphify-out/.graphify_analysis.json
          graphify-out/.graphify_labels.json

  native-vision-fallback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure geometry-only vision core
        run: >-
          cmake -S native/vision_core -B native/vision_core/build_ci
          -DSC_VISION_ENABLE_OPENCV=OFF
          -DSC_VISION_BUILD_TESTS=ON
          -DSC_VISION_WARNINGS_AS_ERRORS=ON
          -DCMAKE_BUILD_TYPE=Release
      - name: Build geometry-only vision core
        run: cmake --build native/vision_core/build_ci --config Release --parallel
      - name: Test geometry-only vision core
        run: >-
          ctest --test-dir native/vision_core/build_ci
          --build-config Release
          --output-on-failure
      - name: Verify honest unsupported CLI result
        shell: bash
        run: |
          RESULT="$(native/vision_core/build_ci/vision_cli analyze \
            --image native/vision_core/test/fixtures/checkerboard.pgm \
            --card-width-mm 550 \
            --card-height-mm 550 \
            --projectile-diameter-mm 5.6 \
            --minimum-long-side-px 8)"
          echo "$RESULT" | jq -e '
            .status == "unsupported" and
            .provenance.backend == "geometryOnly" and
            (.candidateImpacts | length) == 0 and
            ([.warnings[].code] | index("openCvUnavailable") != null)
          '

  native-vision-windows-spaced-path:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: shooting companion
      - name: Configure native core from a checkout path with spaces
        shell: pwsh
        run: >-
          cmake -S "shooting companion/native/vision_core"
          -B "shooting companion/native/vision_core/build spaced path"
          -DSC_VISION_ENABLE_OPENCV=OFF
          -DSC_VISION_BUILD_TESTS=ON
          -DSC_VISION_WARNINGS_AS_ERRORS=ON
      - name: Build native core from a checkout path with spaces
        shell: pwsh
        run: >-
          cmake --build "shooting companion/native/vision_core/build spaced path"
          --config Release --parallel
      - name: Test native core from a checkout path with spaces
        shell: pwsh
        run: >-
          ctest --test-dir "shooting companion/native/vision_core/build spaced path"
          --build-config Release --output-on-failure
